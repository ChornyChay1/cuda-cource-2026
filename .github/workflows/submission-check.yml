name: Проверка лабораторной

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

env:
  CI_TRUSTED_SHA: ${{ github.workflow_sha }}
  PYTHONPATH: ${{ github.workspace }}/lab-runner
  PYTHONSAFEPATH: "1"

concurrency:
  group: submission-static-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pending:
    name: Подготовка PR
    if: ${{ github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_sha: ${{ steps.pending.outputs.head_sha }}
      fingerprint: ${{ steps.pending.outputs.fingerprint }}
    steps:
      - &install_base
        name: Установить системные пакеты
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          log="$RUNNER_TEMP/apt.log"
          if ! {
            apt-get update &&
            apt-get install --yes --no-install-recommends ca-certificates git python3 libstdc++6
          } > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
      - &course_checkout
        name: Получить код курса
        id: course_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: course
          persist-credentials: false
      - &runner_pin
        name: Проверить коммит курса и прочитать пин
        id: runner_pin
        run: |
          [[ $(git -C course rev-parse HEAD) == "$CI_TRUSTED_SHA" ]]
          lock=course/.github/lab-runner.lock
          [[ -f "$lock" && ! -L "$lock" && $(wc -c < "$lock") -eq 41 ]]
          IFS= read -r sha < "$lock"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - &runner_checkout
        name: Получить закреплённый раннер
        id: runner_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: comiam/cuda-cource-lab-runner
          ref: ${{ steps.runner_pin.outputs.sha }}
          path: lab-runner
          token: ${{ secrets.LAB_RUNNER_READ_TOKEN }}
          persist-credentials: false
      - &verify_runner
        name: Проверить коммит раннера
        id: verify_runner
        env:
          EXPECTED_RUNNER_SHA: ${{ steps.runner_pin.outputs.sha }}
        run: '[[ $(git -C lab-runner rev-parse HEAD) == "$EXPECTED_RUNNER_SHA" ]]'
      - name: Подготовить состояние проверки
        id: pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m tools.submission_check.report pending --seed-only --pr-number "$PR_NUMBER" --state-file .ci-state/state.json
      - name: Сохранить состояние проверки
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submission-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-state/state.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Отметить проверку в PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m tools.submission_check.report start --pr-number "$PR_NUMBER" --state-file .ci-state/state.json

  validate:
    name: Проверка сдачи
    timeout-minutes: 15
    needs: pending
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
    steps:
      - *course_checkout
      - *runner_pin
      - *runner_checkout
      - *verify_runner
      - name: Установить инструменты проверки
        run: |
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/submission-tools"
          "$RUNNER_TEMP/submission-tools/bin/python" -m pip install --quiet --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r lab-runner/.ci/requirements.txt
          printf '%s\n' "$RUNNER_TEMP/submission-tools/bin" >> "$GITHUB_PATH"
      - name: Подготовить изолированный анализатор C++/CUDA
        run: |
          log="$RUNNER_TEMP/submission-lint-build.log"
          if ! docker build --file lab-runner/infra/submission-lint/Dockerfile --tag course-submission-lint:local lab-runner > "$log" 2>&1; then
            tail -n 80 "$log"
            exit 1
          fi
      - name: Проверить структуру, оформление и стиль
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.pending.outputs.head_sha }}
          FINGERPRINT: ${{ needs.pending.outputs.fingerprint }}
        run: |
          mkdir -p .ci-result
          python -m tools.submission_check ci --pr-number "$PR_NUMBER" --expected-head-sha "$HEAD_SHA" --expected-fingerprint "$FINGERPRINT" --trusted-root course --semantic-image course-submission-lint:local --output .ci-result/result.json
      - name: Сохранить результат проверки
        if: ${{ always() && steps.verify_runner.outcome == 'success' && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submission-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-result/result.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

  report:
    name: Результат проверки
    timeout-minutes: 10
    if: ${{ always() && github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [pending, validate]
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - *install_base
      - *course_checkout
      - *runner_pin
      - *runner_checkout
      - *verify_runner
      - name: Проверить происхождение артефактов
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.submission_check.artifacts --kinds submission-state submission-result --required-kind submission-state
      - name: Скачать состояние проверки
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifacts.outputs.submission_state_artifact_id }}
          path: .ci-state
          merge-multiple: true
      - name: Скачать результат проверки
        if: ${{ steps.artifacts.outputs.submission_result_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifacts.outputs.submission_result_artifact_id }}
          path: .ci-result
          merge-multiple: true
      - name: Опубликовать итог в PR
        if: ${{ always() && steps.verify_runner.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_OUTCOME: ${{ steps.artifacts.outputs.submission_result_outcome || needs.validate.result }}
        run: python3 -m tools.submission_check.report finish --pr-number "$PR_NUMBER" --state-file .ci-state/state.json --result-file .ci-result/result.json --validation-outcome "$VALIDATION_OUTCOME"
